<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>OCR e2e</title></head>
<body style="font-family:sans-serif">
<pre id="out">RUNNING</pre>
<script type="module">
import Tesseract from '/kaoyan-workbench/vendor/ocr/tesseract.esm.min.js'
const out = document.getElementById('out')
const step = (s) => { out.textContent = s; console.log('[ocr-e2e]', s) }
try {
  step('import ok')
  const w = await Tesseract.createWorker('chi_sim+eng', 1, {
    workerPath: 'https://wangzekai615.github.io/kaoyan-workbench/vendor/ocr/worker.min.js',
    corePath: 'https://wangzekai615.github.io/kaoyan-workbench/vendor/ocr/tesseract-core-simd.wasm.js',
    langPath: 'https://wangzekai615.github.io/kaoyan-workbench/vendor/ocr/',
    logger: m => console.log('[ocr-e2e logger]', JSON.stringify(m)),
  })
  step('worker created')
  const res = await w.recognize('https://wangzekai615.github.io/kaoyan-workbench/icons/icon-192.png')
  step('RESULT:\n' + (res.data.text || '(empty)'))
  await w.terminate()
} catch (e) {
  step('ERROR:\n' + ((e && e.stack) || String(e)).slice(0,400))
}
</script>
</body></html>
