<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>OCR e2e</title></head>
<body style="font-family:sans-serif">
<canvas id="c" width="760" height="280"></canvas>
<pre id="out">RUNNING</pre>
<script type="module">
import Tesseract from '/kaoyan-workbench/vendor/ocr/tesseract.esm.min.js'  // 会被部署为 vendor 内
const out = document.getElementById('out')
const c = document.getElementById('c')
const ctx = c.getContext('2d')
ctx.fillStyle = '#fff'; ctx.fillRect(0,0,760,280)
ctx.fillStyle = '#000'; ctx.font = '42px "SimHei","Microsoft YaHei",sans-serif'
ctx.fillText('极限的运算法则', 50, 90)
ctx.fillText('lim (1+1/x)^x = e', 70, 170)
ctx.fillText('sin(x)/x 的极限是 1', 70, 240)
const blob = await new Promise(r => c.toBlob(r, 'image/png'))
const url = URL.createObjectURL(blob)
try {
  out.textContent = '加载 worker...'
  const w = await Tesseract.createWorker('chi_sim+eng', 1, {
    workerPath: '/kaoyan-workbench/vendor/ocr/worker.min.js',
    corePath: '/kaoyan-workbench/vendor/ocr/tesseract-core.js',
    langPath: '/kaoyan-workbench/vendor/ocr/',
    logger: m => {},
  })
  out.textContent = '识别中...'
  const res = await w.recognize(url)
  out.textContent = 'RESULT:\n' + (res.data.text || '(empty)')
  await w.terminate()
} catch (e) {
  out.textContent = 'ERROR:\n' + (e && e.message ? e.message : String(e)).slice(0,300)
}
</script>
</body></html>
